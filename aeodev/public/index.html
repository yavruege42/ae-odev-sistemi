<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE Ödev Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-indigo-700 p-2 rounded-lg font-bold text-xl shadow">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">AE Ödev Sistemi</h1>
                    <p class="text-xs text-indigo-200">Gerçek Zamanlı Push Bildirim Portalı</p>
                </div>
            </div>
            <div id="user-info" class="flex items-center space-x-4">
                <span id="display-username" class="text-sm font-medium bg-indigo-800 px-3 py-1.5 rounded-full border border-indigo-600"></span>
                <button onclick="resetUser()" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded transition text-indigo-100">
                    <i class="fa-solid fa-user-pen mr-1"></i> Değiştir
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Giriş Modal -->
        <div id="setup-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100">
                <div class="text-center mb-6">
                    <div class="inline-flex bg-indigo-100 text-indigo-600 p-3 rounded-full mb-3 text-2xl">
                        <i class="fa-solid fa-user-shield text-indigo-600"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800">AE Ödev Sistemine Giriş</h2>
                    <p class="text-sm text-slate-500 mt-1">Bildirim alabilmek için adınızı ve rolünüzü seçin.</p>
                </div>
                <form id="setup-form" onsubmit="saveUserAndRole(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Adınız Soyadınız</label>
                        <input type="text" id="input-name" required placeholder="Örn: Ege Yavru" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Sistem Rolü</label>
                        <select id="input-role" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="ogrenci">Öğrenci Portalı</option>
                            <option value="ogretmen">Öğretmen Portalı</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-md transition">
                        Sisteme Giriş Yap & Bildirimleri Aç
                    </button>
                </form>
            </div>
        </div>

        <!-- Öğretmen Paneli -->
        <div id="teacher-panel" class="space-y-6 hidden">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                    <i class="fa-solid fa-circle-plus text-indigo-600 mr-2"></i> Yeni Ödev Yayınla (Tüm Cihazlara Bildirim Gider)
                </h2>
                <form onsubmit="handleCreateHomework(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ödev Başlığı</label>
                        <input type="text" id="hw-title" required placeholder="Örn: Fizik Projesi" class="w-full px-3 py-2 rounded-lg border border-slate-300 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ders Adı</label>
                        <input type="text" id="hw-subject" required placeholder="Örn: Fizik" class="w-full px-3 py-2 rounded-lg border border-slate-300 outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Açıklama</label>
                        <textarea id="hw-desc" rows="3" required placeholder="Detaylar..." class="w-full px-3 py-2 rounded-lg border border-slate-300 outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Son Teslim Tarihi</label>
                        <input type="date" id="hw-deadline" required class="w-full px-3 py-2 rounded-lg border border-slate-300 outline-none">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow transition">
                            <i class="fa-solid fa-paper-plane mr-1"></i> Yayınla ve Bildirim Gönder
                        </button>
                    </div>
                </form>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4">Yayınlanan Ödevler</h2>
                <div id="teacher-hw-list" class="space-y-4"></div>
            </div>
        </div>

        <!-- Öğrenci Paneli -->
        <div id="student-panel" class="space-y-6 hidden">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold text-slate-800 mb-4">Aktif Ödevler</h2>
                <div id="student-hw-list" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
