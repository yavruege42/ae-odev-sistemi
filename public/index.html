<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>AE Ödev Sistemi</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1f2937; text-align: center; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { background: #4f46e5; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #4338ca; }
        .homework-item { background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px; margin-top: 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📚 AE Ödev Sistemi</h2>
    
    <h3>Ödev Yayınla</h3>
    <input type="text" id="subject" placeholder="Ders Adı (Örn: Matematik)">
    <input type="text" id="title" placeholder="Ödev Başlığı">
    <textarea id="desc" placeholder="Açıklama..."></textarea>
    <button onclick="publishHomework()">Yayınla ve Bildirim Gönder 🚀</button>

    <h3 style="margin-top: 25px;">Verilen Ödevler</h3>
    <div id="homeworkList">Yükleniyor...</div>
</div>

<script>
    async function requestNotificationPermission() {
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            const reg = await navigator.serviceWorker.register('/sw.js');
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                const sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: 'BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U'
                });
                await fetch('/api/subscribe', {
                    method: 'POST',
                    body: JSON.stringify(sub),
                    headers: { 'Content-Type': 'application/json' }
                });
            }
        }
    }
    requestNotificationPermission();

    async function publishHomework() {
        const subject = document.getElementById('subject').value;
        const title = document.getElementById('title').value;
        const desc = document.getElementById('desc').value;

        if(!subject || !title) {
            alert('Lütfen alanları doldurun.');
            return;
        }

        const res = await fetch('/api/publish-homework', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject, title, desc })
        });

        const data = await res.json();
        if(data.success) {
            alert('Ödev yayınlandı ve bildirim gönderildi!');
            document.getElementById('subject').value = '';
            document.getElementById('title').value = '';
            document.getElementById('desc').value = '';
            loadHomeworks();
        }
    }

    async function loadHomeworks() {
        const res = await fetch('/api/homeworks');
        const list = await res.json();
        const container = document.getElementById('homeworkList');
        
        if(list.length === 0) {
            container.innerHTML = '<p style="color:#666;">Henüz ödev yok.</p>';
            return;
        }

        container.innerHTML = list.map(hw => `
            <div class="homework-item">
                <strong>${hw.subject}</strong>: ${hw.title}
                <p style="margin: 5px 0 0 0; color: #4b5563; font-size: 14px;">${hw.desc}</p>
            </div>
        `).join('');
    }

    loadHomeworks();
</script>

</body>
</html>
