<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>AE Ödev Sistemi</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eff6ff; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.1); }
        h2 { color: #1e40af; text-align: center; }
        h3 { color: #1e3a8a; font-size: 16px; margin-top: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #93c5fd; border-radius: 6px; box-sizing: border-box; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
        button { background: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .homework-item { background: #f8fafc; border: 1px solid #bfdbfe; padding: 12px; margin-top: 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📚 AE Ödev Sistemi</h2>
    
    <h3>Yeni Ödev Yayınla</h3>
    <input type="text" id="subject" placeholder="Ders Adı (Örn: Matematik)">
    <input type="text" id="title" placeholder="Ödev Başlığı">
    <textarea id="desc" placeholder="Ödev Açıklaması..."></textarea>
    <button onclick="publishHomework()">Yayınla ve Bildirim Gönder 🚀</button>

    <h3>Verilen Ödevler</h3>
    <div id="homeworkList">Yükleniyor...</div>
</div>

<script>
    async function requestNotificationPermission() {
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            const reg = await navigator.serviceWorker.register('/sw.js');
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                const sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: 'BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U'
                });
                await fetch('/api/subscribe', {
                    method: 'POST',
                    body: JSON.stringify(sub),
                    headers: { 'Content-Type': 'application/json' }}
                );
            }
        }
    }
    requestNotificationPermission();

    async function publishHomework() {
        const subject = document.getElementById('subject').value;
        const title = document.getElementById('title').value;
        const desc = document.getElementById('desc').value;

        if(!subject || !title) {
            alert('Lütfen ders adı ve başlığı doldurun.');
            return;
        }

        const res = await fetch('/api/publish-homework', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject, title, desc })
        });

        const data = await res.json();
        if(data.success) {
            alert('Ödev yayınlandı ve bildirim gönderildi!');
            document.getElementById('subject').value = '';
            document.getElementById('title').value = '';
            document.getElementById('desc').value = '';
            loadHomeworks();
        }
    }

    async function loadHomeworks() {
        const res = await fetch('/api/homeworks');
        const list = await res.json();
        const container = document.getElementById('homeworkList');
        
        if(list.length === 0) {
            container.innerHTML = '<p style="color:#64748b; font-size:14px;">Henüz verilmiş ödev yok.</p>';
            return;
        }

        container.innerHTML = list.map(hw => `
            <div class="homework-item">
                <strong>${hw.subject}</strong>: ${hw.title}
                <p style="margin: 5px 0 0 0; color: #475569; font-size: 14px;">${hw.desc}</p>
            </div>
        `).join('');
    }

    loadHomeworks();
</script>

</body>
</html>
